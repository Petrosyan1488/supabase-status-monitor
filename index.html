<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Монитор статусов Supabase</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 25px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    h1, h2 {
      text-align: center;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      background: #16a34a;
      margin: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    .danger {
      background: #e11d48;
    }

    .gray {
      background: #6b7280;
    }

    .yellow {
      background: #f59e0b;
    }

    select, input {
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .status {
      font-weight: bold;
      color: #2563eb;
    }

    .online-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 8px;
    }

    .offline-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #cbd5e1;
      border-radius: 50%;
      margin-right: 8px;
    }

    .timer {
      text-align: center;
      font-size: 28px;
      color: #2563eb;
      font-weight: bold;
      margin: 15px 0;
    }

    .chat-box {
      height: 230px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      background: #fafafa;
      margin-bottom: 10px;
    }

    .chat-input {
      display: flex;
      gap: 8px;
    }

    .chat-input input {
      flex: 1;
    }

    .chat-input button {
      margin: 0;
    }

    .user-row {
      margin: 10px 0;
    }

    .center {
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Монитор статусов на Supabase</h1>

      <h2 id="userNameTitle">Вы не вошли</h2>

      <div class="timer">
        ⏱️ <span id="studyTimer">0 сек.</span>
      </div>

      <div class="center">
        <button onclick="signInWithGoogle()">Войти через Google</button>
        <button class="danger" onclick="finishSession()">⛔ Завершить сессию</button>
        <button class="yellow" onclick="setBreak()">☕ Перерыв</button>
        <button class="gray" onclick="signOut()">Выход</button>
      </div>
    </div>

    <div class="card">
      <h2>Мой статус</h2>

      <p><strong>Имя:</strong> <span id="myName">Загрузка...</span></p>
      <p><strong>Статус:</strong> <span class="status" id="myStatus">Загрузка...</span></p>

      <select id="statusSelect">
        <option value="На учебе">На учебе</option>
        <option value="Дома">Дома</option>
        <option value="На улице">На улице</option>
        <option value="Отдыхаю">Отдыхаю</option>
        <option value="Перерыв">Перерыв</option>
      </select>

      <button onclick="updateStatus()">Обновить статус</button>
    </div>

    <div class="card">
      <h2>👥 Монитор группы</h2>
      <div id="profilesList">Загрузка...</div>
    </div>

    <div class="card">
      <h2>💬 Общий чат</h2>

      <div class="chat-box" id="chatBox">
        Загрузка сообщений...
      </div>

      <div class="chat-input">
        <input id="messageInput" type="text" placeholder="Сообщение..." />
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://aocsygtduocsqevgbpqg.supabase.co";
    const supabaseKey = "sb_publishable_XRbpecmnfjdB-El_Y_rT5w_EK6Hb1c2";

    const supabase = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let currentProfile = null;
    let timerInterval = null;

    async function signInWithGoogle() {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: "https://petrosyan1488.github.io/supabase-status-monitor/"
        }
      });

      if (error) {
        alert("Ошибка входа: " + error.message);
      }
    }

    async function signOut() {
      if (currentUser) {
        await supabase
          .from("profiles2")
          .update({ is_online: false })
          .eq("id", currentUser.id);
      }

      await supabase.auth.signOut();
      location.reload();
    }

    async function ensureProfile(user) {
      const username =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email ||
        "Без имени";

      const { data } = await supabase
        .from("profiles2")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

      if (!data) {
        await supabase.from("profiles2").insert([
          {
            id: user.id,
            username: username,
            status: "На учебе",
            is_online: true,
            study_started_at: new Date().toISOString()
          }
        ]);
      } else {
        const updateData = { is_online: true };

        if (data.status === "На учебе" && !data.study_started_at) {
          updateData.study_started_at = new Date().toISOString();
        }

        await supabase
          .from("profiles2")
          .update(updateData)
          .eq("id", user.id);
      }
    }

    async function loadMyProfile() {
      if (!currentUser) {
        document.getElementById("myName").textContent = "Вы не вошли";
        document.getElementById("myStatus").textContent = "-";
        document.getElementById("userNameTitle").textContent = "Вы не вошли";
        return;
      }

      const { data, error } = await supabase
        .from("profiles2")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (error) {
        document.getElementById("myStatus").textContent = error.message;
        return;
      }

      currentProfile = data;

      document.getElementById("myName").textContent = data.username;
      document.getElementById("myStatus").textContent = data.status;
      document.getElementById("userNameTitle").textContent = data.username;
      document.getElementById("statusSelect").value = data.status;

      startTimer();
    }

    async function loadAllProfiles() {
      const { data, error } = await supabase
        .from("profiles2")
        .select("*")
        .order("username", { ascending: true });

      if (error) {
        document.getElementById("profilesList").textContent = error.message;
        return;
      }

      const list = document.getElementById("profilesList");
      list.innerHTML = "";

      data.forEach(profile => {
        const div = document.createElement("div");
        div.className = "user-row";

        const dot = profile.is_online
          ? `<span class="online-dot"></span>`
          : `<span class="offline-dot"></span>`;

        let timeText = "";

        if (profile.status === "На учебе" && profile.study_started_at) {
          timeText = ` — ${formatStudyTime(profile.study_started_at)}`;
        }

        div.innerHTML = `
          ${dot}
          <strong>${profile.username}</strong>:
          <span class="status">${profile.status}</span>
          <span>${timeText}</span>
        `;

        list.appendChild(div);
      });
    }

    async function updateStatus() {
      if (!currentUser) {
        alert("Сначала войдите через Google");
        return;
      }

      const newStatus = document.getElementById("statusSelect").value;

      const updateData = {
        status: newStatus,
        is_online: true
      };

      if (newStatus === "На учебе") {
        updateData.study_started_at = new Date().toISOString();
      } else {
        updateData.study_started_at = null;
      }

      const { error } = await supabase
        .from("profiles2")
        .update(updateData)
        .eq("id", currentUser.id);

      if (error) {
        alert("Ошибка обновления: " + error.message);
        return;
      }

      await loadMyProfile();
      await loadAllProfiles();
    }

    async function setBreak() {
      if (!currentUser) return alert("Сначала войдите через Google");

      await supabase
        .from("profiles2")
        .update({
          status: "Перерыв",
          study_started_at: null,
          is_online: true
        })
        .eq("id", currentUser.id);

      await loadMyProfile();
      await loadAllProfiles();
    }

    async function finishSession() {
      if (!currentUser) return alert("Сначала войдите через Google");

      await supabase
        .from("profiles2")
        .update({
          status: "Дома",
          is_online: false,
          study_started_at: null
        })
        .eq("id", currentUser.id);

      await loadMyProfile();
      await loadAllProfiles();
    }

    function startTimer() {
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (
          currentProfile &&
          currentProfile.status === "На учебе" &&
          currentProfile.study_started_at
        ) {
          document.getElementById("studyTimer").textContent =
            formatStudyTime(currentProfile.study_started_at);
        } else {
          document.getElementById("studyTimer").textContent = "0 сек.";
        }
      }, 1000);
    }

    function formatStudyTime(startTime) {
      const start = new Date(startTime);
      const now = new Date();

      let seconds = Math.floor((now - start) / 1000);
      if (seconds < 0) seconds = 0;

      const hours = Math.floor(seconds / 3600);
      seconds %= 3600;

      const minutes = Math.floor(seconds / 60);
      seconds %= 60;

      if (hours > 0) {
        return `${hours} ч ${minutes} м ${seconds} с`;
      }

      if (minutes > 0) {
        return `${minutes} м ${seconds} с`;
      }

      return `${seconds} сек.`;
    }

    async function loadMessages() {
      const { data, error } = await supabase
        .from("messages")
        .select("*")
        .order("created_at", { ascending: true })
        .limit(50);

      if (error) {
        document.getElementById("chatBox").textContent = error.message;
        return;
      }

      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML = "";

      data.forEach(message => {
        const div = document.createElement("div");
        div.innerHTML = `<strong>${message.username}:</strong> ${message.text}`;
        chatBox.appendChild(div);
      });

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      if (!currentUser || !currentProfile) {
        alert("Сначала войдите через Google");
        return;
      }

      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text) return;

      const { error } = await supabase
        .from("messages")
        .insert([
          {
            user_id: currentUser.id,
            username: currentProfile.username,
            text: text
          }
        ]);

      if (error) {
        alert("Ошибка отправки: " + error.message);
        return;
      }

      input.value = "";
      await loadMessages();
    }

    async function initAuth() {
      const { data } = await supabase.auth.getUser();
      currentUser = data?.user ?? null;

      if (currentUser) {
        await ensureProfile(currentUser);
      }

      await loadMyProfile();
      await loadAllProfiles();
      await loadMessages();
    }

    supabase.auth.onAuthStateChange(async () => {
      await initAuth();
    });

    supabase
      .channel("profiles2-realtime")
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "profiles2" },
        async () => {
          await loadMyProfile();
          await loadAllProfiles();
        }
      )
      .subscribe();

    supabase
      .channel("messages-realtime")
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "messages" },
        async () => {
          await loadMessages();
        }
      )
      .subscribe();

    window.signInWithGoogle = signInWithGoogle;
    window.signOut = signOut;
    window.updateStatus = updateStatus;
    window.setBreak = setBreak;
    window.finishSession = finishSession;
    window.sendMessage = sendMessage;

    window.addEventListener("beforeunload", async () => {
      if (currentUser) {
        await supabase
          .from("profiles2")
          .update({ is_online: false })
          .eq("id", currentUser.id);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        const input = document.getElementById("messageInput");
        if (document.activeElement === input) {
          sendMessage();
        }
      }
    });

    initAuth();
  </script>
</body>
</html>
