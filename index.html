<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Монитор статусов Supabase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1, h2 {
      text-align: center;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      background: #fafafa;
    }

    .status {
      font-weight: bold;
      color: #2563eb;
    }

    select, button {
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      margin-left: 10px;
    }

    button:hover {
      background: #15803d;
    }

    .auth-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .secondary {
      background: #6b7280;
    }

    .secondary:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Монитор статусов на Supabase</h1>

    <div class="card">
      <h2>Авторизация</h2>
      <div class="auth-buttons">
        <button onclick="signInWithGoogle()">Войти через Google</button>
        <button class="secondary" onclick="signOut()">Выйти</button>
      </div>
    </div>

    <div class="card">
      <h2>Мой статус</h2>
      <p><strong>Имя:</strong> <span id="myName">Загрузка...</span></p>
      <p><strong>Статус:</strong> <span class="status" id="myStatus">Загрузка...</span></p>

      <select id="statusSelect">
        <option value="На учебе">На учебе</option>
        <option value="Дома">Дома</option>
        <option value="На улице">На улице</option>
        <option value="Отдыхаю">Отдыхаю</option>
      </select>
      <button onclick="updateStatus()">Обновить статус</button>
    </div>

    <div class="card">
      <h2>Все пользователи</h2>
      <div id="profilesList">Загрузка...</div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://aocsygtduocsqevgbpqg.supabase.co";
    const supabaseKey = "sb_publishable_XRbpecmnfjdB-El_Y_rT5w_EK6Hb1c2";

    const supabase = createClient(supabaseUrl, supabaseKey);

    let currentUser = null;

    async function signInWithGoogle() {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: "https://petrosyan1488.github.io/supabase-status-monitor/"
        }
      });

      if (error) {
        alert("Ошибка входа: " + error.message);
      }
    }

    async function signOut() {
      const { error } = await supabase.auth.signOut();

      if (error) {
        alert("Ошибка выхода: " + error.message);
        return;
      }

      location.reload();
    }

    async function ensureProfile(user) {
      const username =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email ||
        "Без имени";

      const { data: existingProfile, error: selectError } = await supabase
        .from("profiles2")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

      if (selectError) {
        console.error("Ошибка проверки профиля:", selectError.message);
        return;
      }

      if (!existingProfile) {
        const { error: insertError } = await supabase
          .from("profiles2")
          .insert([
            {
              id: user.id,
              username: username,
              status: "На учебе"
            }
          ]);

        if (insertError) {
          console.error("Ошибка создания профиля:", insertError.message);
        }
      }
    }

    async function loadMyProfile() {
      if (!currentUser) {
        document.getElementById("myName").textContent = "Вы не вошли";
        document.getElementById("myStatus").textContent = "-";
        return;
      }

      const { data, error } = await supabase
        .from("profiles2")
        .select("*")
        .eq("id", currentUser.id)
        .single();

      if (error) {
        document.getElementById("myName").textContent = "Ошибка";
        document.getElementById("myStatus").textContent = error.message;
        return;
      }

      document.getElementById("myName").textContent = data.username;
      document.getElementById("myStatus").textContent = data.status;
      document.getElementById("statusSelect").value = data.status;
    }

    async function loadAllProfiles() {
      const { data, error } = await supabase
        .from("profiles2")
        .select("*")
        .order("username", { ascending: true });

      if (error) {
        document.getElementById("profilesList").textContent = error.message;
        return;
      }

      const list = document.getElementById("profilesList");
      list.innerHTML = "";

      data.forEach(profile => {
        const div = document.createElement("div");
        div.innerHTML = `<p><strong>${profile.username}</strong>: <span class="status">${profile.status}</span></p>`;
        list.appendChild(div);
      });
    }

    async function updateStatus() {
      if (!currentUser) {
        alert("Сначала войдите через Google");
        return;
      }

      const newStatus = document.getElementById("statusSelect").value;

      const { error } = await supabase
        .from("profiles2")
        .update({ status: newStatus })
        .eq("id", currentUser.id);

      if (error) {
        alert("Ошибка обновления: " + error.message);
        return;
      }

      await loadMyProfile();
      await loadAllProfiles();
    }

    async function initAuth() {
      const { data, error } = await supabase.auth.getUser();

      if (error) {
        console.error("Ошибка получения пользователя:", error.message);
      }

      currentUser = data?.user ?? null;

      if (currentUser) {
        await ensureProfile(currentUser);
      }

      await loadMyProfile();
      await loadAllProfiles();
    }

    supabase.auth.onAuthStateChange(async () => {
      await initAuth();
    });

    supabase
      .channel("profiles2-realtime")
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "profiles2" },
        () => {
          loadMyProfile();
          loadAllProfiles();
        }
      )
      .subscribe();

    window.signInWithGoogle = signInWithGoogle;
    window.signOut = signOut;
    window.updateStatus = updateStatus;

    initAuth();
  </script>
</body>
</html>
